<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <title>Devfinder</title>
</head>
<body>
    <header>
        <h3 class="logo">devfinder</h3>
        <div class="themebutton">DARK
        <img src="img/Path.svg" alt="Dark_mode"></div>
    </header>
    <form action="/search" method="get">
        <img src="img/Combined Shape.svg" alt="Magnifier">
        <input type="text" placeholder="Search GitHub username…">
        <button type="submit">Search</button>
    </form>

    <main>
        <img src="img/Bitmap.png" alt="Avatar" class="Avatar">
        <div class="profile">
            <div class="profile_header">
        <h2>The Octocat</h2>
        <span class="Joined">Joined 25 Jan 2011</span> 
        <div class="username">@octocat</div>
    </div>
        <div class="bio">This profile has no bio</div>

        
            <table class="stats">
                <tr class="Property">
                    <td>Repos</td>
                    <td>Followers</td>
                    <td>Following</td>
                </tr>
                 <tr class="Value">
                    <td>8</td>
                    <td>3938</td>
                    <td>9</td>
                </tr>
            </table>
      
           
            <table class="links">

            <td>
                <tr>
                    <td><i class="fa-solid fa-location-dot"></i>
                        <a href="">San Francisco</a>
           </td>
                    <td><i class="fa-brands fa-twitter"></i>
           <a href="" class="twitter">Not Available</a></td>
                </tr>
                <tr>
                    <td><img src="img/Blog Icon.svg" alt="" class="icon"> 
            <a href="">https://github.blog</a></td>
                    <td> <img src="img/Company Icon.svg" alt="" class="icon"> 
            <a href="">@github</a>
 </td>
                </tr>
            </td>
            </table>
           
            


            
  

        </div>
    </main>
    
</body>
</html>
